<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mind Map — Topic 3: Data Engineering Inside an Organization</title>
<style>
  :root { --ink:#223; --card:#fff; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#f4f6f9; color:var(--ink); overflow:hidden; }
  #app { position:relative; width:100vw; height:100vh; }
  svg { width:100%; height:100%; display:block; cursor:grab; }
  svg.dragging { cursor:grabbing; }
  .toolbar { position:absolute; top:14px; left:14px; display:flex; gap:8px; z-index:10; flex-wrap:wrap; }
  .toolbar button { height:34px; padding:0 13px; border:1px solid #d7dbe2; border-radius:8px; background:#fff; cursor:pointer; font-size:13px; font-weight:700; color:#555; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .toolbar button:hover { background:#f0f3f8; }
  .toolbar select { height:34px; border:1px solid #d7dbe2; border-radius:8px; padding:0 8px; font-size:13px; font-weight:700; color:#555; background:#fff; cursor:pointer; }
  .titlebar { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:9; text-align:center; pointer-events:none; }
  .titlebar h1 { margin:0; font-size:15px; letter-spacing:.2px; }
  .titlebar p { margin:2px 0 0; font-size:11px; color:#7a8290; }
  .hint { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); z-index:9; font-size:11px; color:#8a919e; background:rgba(255,255,255,.85); padding:5px 12px; border-radius:20px; pointer-events:none; }
  .tooltip { position:absolute; top:60px; left:14px; z-index:11; max-width:300px; background:#1f2733; color:#fff; font-size:12px; line-height:1.45; padding:10px 12px; border-radius:10px; display:none; box-shadow:0 6px 18px rgba(0,0,0,.2); }
  .info-card { font-family:system-ui, sans-serif; background:#fff; border:1px solid #dfe4ec; border-radius:12px; padding:10px 12px; box-shadow:0 8px 22px rgba(20,30,50,.16); font-size:12px; line-height:1.4; color:#2a3140; }
  .info-card .t { font-weight:800; font-size:12.5px; margin-bottom:6px; color:#1d2939; }
  .info-card .lbl { font-weight:800; font-size:10px; letter-spacing:.4px; text-transform:uppercase; color:#7b8798; margin-top:6px; }
  .info-card .ex { color:#3d4a5c; }
  .arrow-hit { cursor:pointer; }
  .arrow-hit:hover circle { stroke-width:3; }
</style>
</head>
<body>
<div id="app">
  <div class="titlebar">
    <h1>📘 Topic 3 — Data Engineering Inside an Organization</h1>
    <p>Data Engineering Exam Prep · click the small <b>▸</b> arrow on any topic to learn more</p>
  </div>

  <div class="toolbar">
    <button id="palBtn" title="Change colours">🎨 <span id="palName">Bauhaus</span></button>
    <button id="zoomOut">−</button>
    <button id="zoomIn">+</button>
    <button id="fitBtn">⤢ Fit</button>
    <button id="fsBtn">⛶ Fullscreen</button>
    <button id="saveBtn">💾 Save</button>
    <button id="mdBtn">⬇ .md</button>
  </div>

  <div class="tooltip" id="tooltip"></div>
  <div class="hint">Drag empty space to pan · scroll to zoom · click a pill to collapse/expand · click ▸ for description + real-life example</div>

  <svg id="map" xmlns="http://www.w3.org/2000/svg">
    <rect id="bg" x="-5000" y="-5000" width="10000" height="10000" fill="#f4f6f9"/>
    <g id="viewport"></g>
  </svg>
</div>

<script>
/* ============================ MIND MAP DATA ============================ */
const mindmapData = {
  central: "Data Engineering in an Organization",
  branches: [
    {
      label: "🏢 Where It Fits",
      group: 0,
      desc: "Data engineering is a bridge between raw operational data and the people/systems that create value from it.",
      example: "Business → source systems → data engineering → data platform → analysts, scientists and apps.",
      children: [
        { label: "Not isolated",
          desc: "It is not just 'collect data and hand it to analysts' — it connects the whole organization.",
          example: "The same engine feeds reports, ML models and customer-facing products." },
        { label: "Company sources",
          desc: "Website, app, payment, CRM, inventory and logistics — each with different DBs, formats and speeds.",
          example: "Six systems, six different data shapes, brought into one platform." },
        { label: "The data platform",
          desc: "Storage, compute, ingestion, transformation, catalog, monitoring and access control in one place.",
          example: "A shared foundation instead of every team building its own pipes." },
      ],
    },
    {
      label: "👥 Teams & Roles",
      group: 0,
      desc: "Data engineering provides the reliable foundation that analysts, scientists and ML engineers depend on.",
      example: "One clean dataset can be used by many different roles.",
      children: [
        { label: "Data Engineer",
          desc: "Builds pipelines, storage and transformation; owns quality, reliability and scale.",
          example: "Creates the clean 'customer' table everyone trusts." },
        { label: "Data Analyst",
          desc: "Reports, dashboards, KPIs and finding trends in existing data.",
          example: "Answers: 'Why did sales drop 15% this month?'" },
        { label: "Data Scientist",
          desc: "Statistics, machine learning and predictive models.",
          example: "Predicts which customers are likely to leave." },
        { label: "ML Engineer",
          desc: "Deploys and operates models in production.",
          example: "Takes the scientist's model and serves it in the app." },
        { label: "Software Engineer",
          desc: "Builds applications and services that generate the data.",
          example: "A food-delivery app creates order events for the engineer." },
        { label: "Business / Product",
          desc: "Defines what the organization actually needs.",
          example: "'We need a weekly customer-retention dashboard.'" },
      ],
    },
    {
      label: "🔄 Operational vs Analytical",
      group: 1,
      desc: "Operational systems run the business; analytical systems answer big questions without slowing the business down.",
      example: "A huge 5-year sales query should not freeze the live order website at noon.",
      children: [
        { label: "Operational systems",
          desc: "Banking, e-commerce orders, hospital and airline systems tuned for running daily work.",
          example: "Placing an order must be fast and reliable." },
        { label: "Why separate?",
          desc: "Heavy analytics on production can consume resources and slow real customers.",
          example: "Thousands buying at 12 PM while an analyst scans 5 years of data." },
        { label: "Analytical environment",
          desc: "Ingestion copies data into a separate platform/store for BI and heavy queries.",
          example: "Production DB → ingestion → analytical store → dashboard." },
      ],
    },
    {
      label: "🏗️ Team Structures",
      group: 1,
      desc: "Data teams can be centralized, decentralized or hybrid — each with trade-offs.",
      example: "Choosing how to organize people changes speed and consistency.",
      children: [
        { label: "Centralized",
          desc: "One central team serves everyone: consistent standards and governance, but can be a bottleneck.",
          example: "One help-desk for all departments — fair but slow." },
        { label: "Decentralized",
          desc: "Each department has its own team: strong domain knowledge and speed, but duplicated work.",
          example: "Sales, Finance and Marketing each build their own pipeline." },
        { label: "Hybrid",
          desc: "Central team provides shared platform and standards; domain teams work on their own data.",
          example: "Common roads, different vehicles per department." },
      ],
    },
    {
      label: "🚧 Data Silos",
      group: 2,
      desc: "A data silo is data trapped in one department, hard for others to access or combine.",
      example: "Marketing says 1,00,000 customers, Sales says 92,000, Finance says 97,000.",
      children: [
        { label: "What is a silo?",
          desc: "Isolated department data that cannot be easily integrated or trusted across the company.",
          example: "Three databases that never talk to each other." },
        { label: "Why numbers differ",
          desc: "Different IDs, definitions, update times, duplicates and filtering rules.",
          example: "Customer_ID vs Cust_ID vs Client_ID all mean the same customer." },
        { label: "Problems caused",
          desc: "Duplicate data, inconsistent definitions, hard reporting and poor decisions.",
          example: "Management cannot tell which customer count is correct." },
        { label: "The fix",
          desc: "Standardized pipelines and common definitions, backed by governance.",
          example: "One clean, agreed 'customer' table used by everyone." },
      ],
    },
    {
      label: "💰 Business Value & Scenarios",
      group: 2,
      desc: "Data engineering is not the goal — reliable data leads to better, faster decisions and real business value.",
      example: "Good data → good decisions → higher revenue.",
      children: [
        { label: "Value chain",
          desc: "Business → sources → data engineering → platform → analytics/ML → business value.",
          example: "Remember this one line for any scenario answer." },
        { label: "Better decisions",
          desc: "Reliable sales data reveals a decline, strategy changes, revenue grows.",
          example: "Dashboard shows falling sales → new marketing campaign." },
        { label: "Retail dashboard scenario",
          desc: "Sales, Marketing and Inventory DBs unified: find sources, ingest, store, standardize, secure, monitor.",
          example: "One dashboard from three separate systems." },
        { label: "Bank fraud scenario",
          desc: "Data engineer prepares the ML-ready dataset; the data scientist builds the fraud model.",
          example: "Engineer prepares data, scientist predicts fraud." },
        { label: "Bad data chain",
          desc: "Bad data → bad analysis → bad models → bad decisions. The foundation matters.",
          example: "Wrong customer IDs lead to wrong churn predictions." },
      ],
    },
  ],
};

/* ===================== MANDATORY GEOMETRY FUNCTIONS ===================== */
function getPill(label, depth) {
  var fs = depth === 0 ? 17 : depth === 1 ? 14 : 12;
  var pad = depth === 0 ? 34 : depth === 1 ? 22 : 18;
  return {
    w: Math.max(label.length * fs * 0.62 + pad * 2, 90),
    h: depth === 0 ? 50 : depth === 1 ? 38 : 32,
  };
}
function edgePoint(cx, cy, hw, hh, tx, ty) {
  var dx = tx - cx, dy = ty - cy;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 0.01) return { x: cx + hw, y: cy };
  var nx = dx / dist, ny = dy / dist;
  var t = 1.0 / Math.sqrt((nx * nx) / (hw * hw) + (ny * ny) / (hh * hh));
  return { x: cx + nx * t, y: cy + ny * t };
}
function buildCurve(ax, ay, aLabel, aDepth, bx, by, bLabel, bDepth) {
  var pa = getPill(aLabel, aDepth), pb = getPill(bLabel, bDepth);
  var s = edgePoint(ax, ay, pa.w / 2, pa.h / 2, bx, by);
  var e = edgePoint(bx, by, pb.w / 2, pb.h / 2, ax, ay);
  var qx = (s.x + e.x) / 2 + (s.y - e.y) * 0.18;
  var qy = (s.y + e.y) / 2 + (e.x - s.x) * 0.18;
  return "M " + s.x + " " + s.y + " Q " + qx + " " + qy + " " + e.x + " " + e.y;
}

/* ============================== PALETTES =============================== */
const PALETTES = {
  Bauhaus: ["#D64045","#1D3557","#E9B44C","#2D6A4F","#7B2D8E","#E07A5F","#457B9D"],
  "Ocean Sunset": ["#E76F51","#2A9D8F","#E9C46A","#264653","#F4A261","#287271","#BC4749"],
  "Nordic Forest": ["#5B8C5A","#4A6FA5","#C17C74","#7B6D8D","#D4A574","#4D8B8B","#8B6F47"],
  "Pastel Garden": ["#7EB8DA","#B5C99A","#E8A87C","#9B8EC1","#F2CC8F","#81B29A","#E07A5F"],
};
let palName = "Bauhaus";

/* ============================== LAYOUT ================================= */
function buildLayout(data) {
  var nodes = [], edges = [], cx = 600, cy = 450;
  nodes.push({ id: "root", label: data.central, x: cx, y: cy, depth: 0,
    childIds: [], collapsed: false, bi: -1, desc: null, example: null, detail: null });
  var branches = data.branches || [];
  var sorted = branches.map(function(b, i) { return Object.assign({}, b, { oi: i }); });
  sorted.sort(function(a, b) { return (a.group || 0) - (b.group || 0); });
  var groups = [], lastG = null;
  sorted.forEach(function(b, i) { if ((b.group || 0) !== lastG) { groups.push(i); lastG = (b.group || 0); } });
  var gapExtra = 0.14, totalGap = Math.max(0, groups.length - 1) * gapExtra;
  var baseStep = (2 * Math.PI - totalGap) / sorted.length;
  var angle = -Math.PI / 2;
  sorted.forEach(function(branch, i) {
    if (i > 0 && groups.indexOf(i) !== -1) angle += gapExtra;
    var bAngle = angle + (i * 0.05 - 0.08);
    var bx = cx + Math.cos(bAngle) * 300, by = cy + Math.sin(bAngle) * 300;
    var bId = "b-" + branch.oi;
    nodes.push({ id: bId, label: branch.label, x: bx, y: by, depth: 1,
      childIds: [], collapsed: false, bi: branch.oi,
      desc: branch.desc || null, example: branch.example || null, detail: branch.desc || null });
    nodes[0].childIds.push(bId);
    edges.push({ from: "root", to: bId, bi: branch.oi, depth: 1 });
    var kids = branch.children || [];
    kids.forEach(function(child, j) {
      var cc = kids.length, spread = Math.PI * (cc > 4 ? 0.65 : 0.5);
      var sa = bAngle - spread / 2;
      var ca = cc === 1 ? bAngle : sa + (j / (cc - 1)) * spread;
      var sx = bx + Math.cos(ca) * 185, sy = by + Math.sin(ca) * 185;
      var cId = "s-" + branch.oi + "-" + j;
      nodes.push({ id: cId, label: child.label, x: sx, y: sy, depth: 2,
        childIds: [], collapsed: false, bi: branch.oi,
        desc: child.desc || null, example: child.example || null, detail: child.desc || null });
      nodes.find(function(n) { return n.id === bId; }).childIds.push(cId);
      edges.push({ from: bId, to: cId, bi: branch.oi, depth: 2 });
    });
    angle += baseStep;
  });
  return { nodes: nodes, edges: edges };
}

/* =============================== STATE ================================= */
let layout = buildLayout(mindmapData);
let nodesMap = new Map(layout.nodes.map(n => [n.id, n]));
let openInfo = new Set();
let collapsed = new Set();
let tx = 0, ty = 0, k = 1;
let dragging = false, dragX = 0, dragY = 0;

const svg = document.getElementById("map");
const viewport = document.getElementById("viewport");
const tooltip = document.getElementById("tooltip");
const palette = () => PALETTES[palName];
const colorFor = (bi) => palette()[((bi % palette().length) + palette().length) % palette().length];

/* ============================== RENDER ================================= */
function render() {
  const pal = palette();
  let parts = [];

  layout.edges.forEach(function(edge) {
    if (collapsed.has(edge.from)) return;
    var fromN = nodesMap.get(edge.from), toN = nodesMap.get(edge.to);
    if (!fromN || !toN) return;
    var d = buildCurve(fromN.x, fromN.y, fromN.label, fromN.depth,
                       toN.x, toN.y, toN.label, toN.depth);
    var color = edge.depth === 1 ? colorFor(edge.bi) : pal[edge.bi % pal.length];
    parts.push('<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' +
      (edge.depth === 1 ? 2.6 : 1.6) + '" stroke-opacity="' +
      (edge.depth === 1 ? 0.5 : 0.28) + '" stroke-linecap="round"/>');
  });

  layout.nodes.forEach(function(node) {
    if (node.depth === 2 && collapsed.has("b-" + node.bi)) return;
    var pill = getPill(node.label, node.depth), w = pill.w, h = pill.h;
    var isRoot = node.depth === 0;
    var bg = isRoot ? "#1D3557" : colorFor(node.bi);
    var fg = "#ffffff";
    var fs = isRoot ? 17 : node.depth === 1 ? 14 : 12;
    var fw = node.depth === 2 ? 600 : 800;
    var arrowX = w / 2 + 15;
    var hasInfo = !!(node.desc || node.example);
    var toggle = collapsed.has(node.id) ? "+" : (node.depth === 1 ? "−" : "");
    parts.push('<g transform="translate(' + node.x + ',' + node.y + ')">' +
      '<g class="node-pill" data-id="' + node.id + '" style="cursor:pointer">' +
        '<rect x="' + (-w/2) + '" y="' + (-h/2) + '" width="' + w + '" height="' + h +
          '" rx="' + (isRoot ? 13 : 19) + '" fill="' + bg + '" fill-opacity="1" ' +
          'stroke="rgba(0,0,0,.12)" stroke-width="1"/>' +
        '<text text-anchor="middle" dy="0.35em" font-size="' + fs + '" font-weight="' + fw +
          '" fill="' + fg + '" style="font-family:system-ui,sans-serif;pointer-events:none">' +
          escapeXml(node.label) + '</text>' +
      '</g>' +
      (toggle ? '<g class="collapse-dot" data-id="' + node.id + '" style="cursor:pointer">' +
        '<circle cx="' + (-w/2 - 13) + '" cy="0" r="10" fill="#fff" stroke="#c8ced9"/>' +
        '<text x="' + (-w/2 - 13) + '" y="0" text-anchor="middle" dy="0.35em" font-size="13" ' +
        'font-weight="800" fill="#556" style="pointer-events:none">' + toggle + '</text></g>' : '') +
      (hasInfo ?
        '<g class="arrow-hit" data-id="' + node.id + '">' +
          '<circle cx="' + arrowX + '" cy="0" r="10" fill="#fff" stroke="' + bg + '" stroke-width="2"/>' +
          '<path d="M ' + (arrowX - 3) + ' -4 L ' + (arrowX + 3) + ' 0 L ' + (arrowX - 3) + ' 4 Z" ' +
            'fill="' + bg + '" style="pointer-events:none" transform="' +
            (openInfo.has(node.id) ? 'rotate(90 ' + arrowX + ' 0)' : '') + '"/>' +
        '</g>' : '') +
      '</g>');
  });

  layout.nodes.forEach(function(node) {
    if (!openInfo.has(node.id)) return;
    if (node.depth === 2 && collapsed.has("b-" + node.bi)) return;
    var pill = getPill(node.label, node.depth);
    var ix = node.x - 140, iy = node.y + pill.h / 2 + 10;
    var html = '<div xmlns="http://www.w3.org/1999/xhtml" class="info-card">' +
      '<div class="t">' + escapeXml(node.label) + '</div>' +
      (node.desc ? '<div class="lbl">💡 In short</div><div>' + escapeXml(node.desc) + '</div>' : '') +
      (node.example ? '<div class="lbl">🏠 Real-life example</div><div class="ex">' + escapeXml(node.example) + '</div>' : '') +
      '</div>';
    parts.push('<foreignObject x="' + ix + '" y="' + iy + '" width="280" height="180">' + html + '</foreignObject>');
  });

  viewport.innerHTML = parts.join("");
  viewport.setAttribute("transform", "translate(" + tx + "," + ty + ") scale(" + k + ")");
  bindNodeEvents();
}
function escapeXml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function bindNodeEvents() {
  viewport.querySelectorAll(".arrow-hit").forEach(function(el) {
    el.addEventListener("click", function(e) {
      e.stopPropagation();
      var id = el.getAttribute("data-id");
      var wasOpen = openInfo.has(id);
      // keep only one card open at a time: clicking a new arrow closes the previous one
      openInfo.clear();
      if (!wasOpen) openInfo.add(id);
      render();
    });
  });
  viewport.querySelectorAll(".collapse-dot").forEach(function(el) {
    el.addEventListener("click", function(e) {
      e.stopPropagation();
      var id = el.getAttribute("data-id");
      collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
      render();
    });
  });
  viewport.querySelectorAll(".node-pill").forEach(function(el) {
    el.addEventListener("click", function(e) {
      e.stopPropagation();
      var id = el.getAttribute("data-id");
      var node = nodesMap.get(id);
      if (node && node.depth === 1) { collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id); render(); }
    });
    el.addEventListener("mouseenter", function() {
      var node = nodesMap.get(el.getAttribute("data-id"));
      if (node && node.detail) { tooltip.textContent = node.detail; tooltip.style.display = "block"; }
    });
    el.addEventListener("mouseleave", function() { tooltip.style.display = "none"; });
  });
}

/* ========================= PAN & ZOOM ================================= */
svg.addEventListener("mousedown", function(e) {
  if (e.target.id === "bg") { dragging = true; dragX = e.clientX - tx; dragY = e.clientY - ty; svg.classList.add("dragging"); }
});
window.addEventListener("mousemove", function(e) {
  if (!dragging) return;
  tx = e.clientX - dragX; ty = e.clientY - dragY;
  viewport.setAttribute("transform", "translate(" + tx + "," + ty + ") scale(" + k + ")");
});
window.addEventListener("mouseup", function() { dragging = false; svg.classList.remove("dragging"); });
svg.addEventListener("wheel", function(e) {
  e.preventDefault();
  k = Math.min(2.5, Math.max(0.35, k * (e.deltaY < 0 ? 1.08 : 0.93)));
  viewport.setAttribute("transform", "translate(" + tx + "," + ty + ") scale(" + k + ")");
}, { passive:false });
document.getElementById("zoomIn").onclick = () => { k = Math.min(2.5, k*1.15); viewport.setAttribute("transform", "translate("+tx+","+ty+") scale("+k+")"); };
document.getElementById("zoomOut").onclick = () => { k = Math.max(0.35, k/1.15); viewport.setAttribute("transform", "translate("+tx+","+ty+") scale("+k+")"); };
document.getElementById("fitBtn").onclick = () => { tx=0; ty=0; k=1; viewport.setAttribute("transform","translate(0,0) scale(1)"); };

/* ===================== PALETTE / SAVE / EXPORT ======================== */
document.getElementById("palBtn").onclick = function() {
  const keys = Object.keys(PALETTES);
  palName = keys[(keys.indexOf(palName)+1) % keys.length];
  document.getElementById("palName").textContent = palName;
  render();
};
document.getElementById("fsBtn").onclick = function() {
  if (!document.fullscreenElement) document.getElementById("app").requestFullscreen?.();
  else document.exitFullscreen?.();
};
async function handleSave() {
  var btn = document.getElementById("saveBtn");
  var slug = mindmapData.central.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  var key = "maps:" + slug;
  var existing = null;
  try { existing = JSON.parse(localStorage.getItem(key) || "null"); } catch(e){}
  var now = new Date().toISOString();
  var record = { data: mindmapData, palette: palName, layout: "radial",
    createdAt: existing ? existing.createdAt : now, updatedAt: now, tags: [] };
  try { localStorage.setItem(key, JSON.stringify(record)); btn.textContent = existing ? "Updated ✓" : "Saved ✓"; }
  catch(e){ btn.textContent = "Error"; }
  setTimeout(()=>{ btn.textContent = "💾 Save"; }, 1800);
}
document.getElementById("saveBtn").onclick = handleSave;
function toMarkmap(d) {
  var esc = t => String(t).replace(/([\\`*_\[\]])/g, "\\$1");
  var out = ["---","title: " + JSON.stringify(d.central),"markmap:","  colorFreezeLevel: 2","  maxWidth: 300","---","","# " + esc(d.central),""];
  (d.branches||[]).forEach(function(b){
    out.push("## " + esc(b.label));
    if (b.desc) out.push("  - " + esc(b.desc));
    if (b.example) out.push("  - Example: " + esc(b.example));
    (b.children||[]).forEach(function(c){
      out.push("- " + esc(c.label));
      if (c.desc) out.push("  - " + esc(c.desc));
      if (c.example) out.push("  - Example: " + esc(c.example));
    });
    out.push("");
  });
  return out.join("\n");
}
document.getElementById("mdBtn").onclick = function() {
  var slug = mindmapData.central.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  var url = URL.createObjectURL(new Blob([toMarkmap(mindmapData)], {type:"text/markdown"}));
  var a = document.createElement("a"); a.href = url; a.download = slug + ".mindmap.md";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),500);
};

render();
</script>
</body>
</html>
